name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Not in private copies (forks), where Actions minutes are paid for.
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg and MediaInfo (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg mediainfo
      - name: Install FFmpeg and MediaInfo (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg mediainfo-cli -y --no-progress
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v
